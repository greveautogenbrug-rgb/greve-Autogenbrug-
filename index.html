<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greve Autogenbrug Araç Kayıt Sistemi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f7;color:#17312e;font:16px Arial,sans-serif}header{background:#174d42;color:white;padding:22px 16px;text-align:center}header h1{font-size:23px;margin:0 0 5px}header p{margin:0;color:#d6e9e2}main{max-width:650px;margin:auto;padding:15px}section{background:#fff;padding:19px;border-radius:16px;margin-bottom:16px;box-shadow:0 3px 12px #0000000c}h2{font-size:20px;margin:0 0 17px}label{display:block;font-weight:700;margin:14px 0 6px}input,select,button{width:100%;font:inherit;border-radius:10px;padding:13px}input,select{border:1px solid #cbd7d3;background:white}input[type=file]{padding:10px}button{border:0;background:#16735a;color:#fff;font-weight:700;margin-top:16px;cursor:pointer}button:disabled{opacity:.5}.hint{color:#63746f;font-size:13px;margin-top:6px}.required{color:#bd3434}#preview{display:none;max-height:230px;max-width:100%;margin:12px auto;border-radius:12px;object-fit:contain}.entry{padding:15px 0;border-top:1px solid #e5ece9}.entry img{width:100%;max-height:260px;object-fit:contain;border-radius:10px;background:#f4f6f5}.entry strong{display:block;margin:10px 0 5px}.entry p{margin:5px 0;overflow-wrap:anywhere}.entry .remove{background:#b83d3d;margin-top:8px}.count{color:#64746f;font-size:14px}#empty{color:#697873}#search{margin:0 0 12px}
</style>
</head>
<body>
<header><h1>Greve Autogenbrug</h1><p>Araç Kayıt Sistemi</p></header>
<main>
<section>
<h2>Yeni Araç</h2>
<form id="vehicleForm">
<label for="firma">1. Firma ismi</label>
<select id="firma"><option value="">Firma seç (isteğe bağlı)</option><option>MCK Auto ApS</option><option>Ara Biler</option><option>Metin Biler</option></select>
<label for="tarih">2. Tarih</label>
<input type="date" id="tarih">
<label for="plaka">3. Plaka</label>
<input id="plaka" placeholder="Plaka (isteğe bağlı)">
<label for="skrot">4. Skrotpræmie</label>
<select id="skrot"><option value="">Seç (isteğe bağlı)</option><option>Skrotsag</option><option>Salgsag</option></select>
<label for="fiyat">5. Fiyat (DKK)</label>
<input type="number" id="fiyat" min="0" step="any" placeholder="Fiyat (isteğe bağlı)">
<label for="resim">6. Resim <span class="required">*</span></label>
<input type="file" id="resim" accept="image/*" required>
<div class="hint">Kameradan çek veya galeriden seç. Sadece resim zorunludur.</div>
<img id="preview" alt="Seçilen fotoğraf">
<button id="save" type="submit">Aracı Kaydet</button>
</form>
</section>
<section>
<h2>Araç Kayıtları <span class="count" id="count"></span></h2>
<input id="search" placeholder="Plaka, firma veya tarih ara...">
<div id="records"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const STORE='greve_arac_kayit_v2';
let records=[];
try{records=JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){records=[]}
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
$('tarih').value=today();
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saveData(){try{localStorage.setItem(STORE,JSON.stringify(records));return true}catch(e){alert('Telefonun kayıt alanı dolmuş olabilir. Fotoğrafı küçültüp tekrar dene.');return false}}
function resizeImage(file){return new Promise((resolve,reject)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{try{const scale=Math.min(1,1200/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.72))}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Fotoğraf okunamadı'))};img.src=url})}
$('resim').addEventListener('change',async()=>{const f=$('resim').files[0];$('preview').style.display='none';if(!f)return;try{const data=await resizeImage(f);$('preview').src=data;$('preview').style.display='block'}catch(e){alert('Fotoğraf açılamadı, başka bir fotoğraf seç.')}});
$('vehicleForm').addEventListener('submit',async e=>{e.preventDefault();const file=$('resim').files[0];if(!file){alert('Resim eklemek zorunlu.');return}const btn=$('save');btn.disabled=true;btn.textContent='Kaydediliyor...';try{const photo=await resizeImage(file);const item={id:String(Date.now())+'-'+Math.random().toString(36).slice(2),firma:$('firma').value,tarih:$('tarih').value,plaka:$('plaka').value.trim(),skrot:$('skrot').value,fiyat:$('fiyat').value,photo};records.unshift(item);if(!saveData()){records.shift();return}$('vehicleForm').reset();$('tarih').value=today();$('preview').style.display='none';render();alert('Araç kaydedildi.')}catch(err){alert('Fotoğraf kaydedilemedi. Başka bir fotoğraf dene.')}finally{btn.disabled=false;btn.textContent='Aracı Kaydet'}});
function render(){const q=$('search').value.trim().toLocaleLowerCase('tr');$('count').textContent='('+records.length+')';const filtered=records.filter(x=>[x.firma,x.tarih,x.plaka,x.skrot,x.fiyat].join(' ').toLocaleLowerCase('tr').includes(q));$('records').innerHTML=filtered.length?filtered.map(x=>`<article class="entry"><img src="${x.photo}" alt="Araç fotoğrafı" loading="lazy"><strong>${escapeHtml(x.plaka||'Plaka girilmedi')}</strong><p><b>Firma:</b> ${escapeHtml(x.firma||'—')}</p><p><b>Tarih:</b> ${escapeHtml(x.tarih||'—')}</p><p><b>Skrotpræmie:</b> ${escapeHtml(x.skrot||'—')}</p><p><b>Fiyat:</b> ${x.fiyat!==''?escapeHtml(x.fiyat)+' DKK':'—'}</p><button class="remove" type="button" data-id="${escapeHtml(x.id)}">Sil</button></article>`).join(''):'<p id="empty">Henüz kayıt yok.</p>'}
$('records').addEventListener('click',e=>{const btn=e.target.closest('button[data-id]');if(!btn)return;if(!confirm('Bu araç kaydı silinsin mi?'))return;const prev=records;records=records.filter(x=>x.id!==btn.dataset.id);if(!saveData())records=prev;render()});
$('search').addEventListener('input',render);render();
</script>
</body>
</html>
